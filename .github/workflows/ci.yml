name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the publish workflow runs these tests before uploading to PyPI

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
        include:
          # the middle versions on Linux only
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=physverify --cov-report=term-missing:skip-covered --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
        shell: bash

  wheel:
    # Build the sdist and wheel, install the wheel in a fresh venv with the
    # source tree off the path, and run the command line: a missing module or
    # data file fails here instead of on PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run it outside the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cp -r examples /tmp/examples
          cd /tmp
          /tmp/venv/bin/physverify --version
          /tmp/venv/bin/physverify demo
          /tmp/venv/bin/physverify run examples/verify_damped_oscillator.py
          /tmp/venv/bin/physverify init verify_solver.py --solver mysolver
          test -f verify_solver.py

  docs:
    # the documentation must build without warnings (broken links, missing snippets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict

  action:
    # The GitHub Action in action.yml, on the example: it must pass on the
    # correct solver and fail on a broken one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          specs: examples/verify_*.py
          html-report: physverify-report-${{ matrix.os }}
      - name: Break the example solver
        shell: bash
        run: sed -i.bak 's/damping = 2.0 \* GAMMA/damping = 2.0 * GAMMA * 1.1/' examples/damped_oscillator.py
      - id: broken
        uses: ./
        continue-on-error: true
        with:
          specs: examples/verify_damped_oscillator.py
          python-version: ""
          html-report: ""
      - name: The broken solver must fail
        if: steps.broken.outcome != 'failure'
        shell: bash
        run: |
          echo "physverify passed a solver with a 10% damping error"
          exit 1
