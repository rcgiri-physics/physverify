# The slow Monte Carlo (Ising) tests are skipped in the normal CI run.
# Run them once a week, and on demand.
name: slow tests

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          PHYSVERIFY_SLOW: "1"
