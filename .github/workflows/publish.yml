name: publish

# Runs when a GitHub release is published. Uses PyPI trusted publishing,
# so no API token is stored in the repository.
on:
  release:
    types: [published]

jobs:
  tests:
    # the full test suite and the action checks; a failure stops the upload
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The release tag must match the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "${{ github.event.release.tag_name }}" = "v$version" || { echo "tag ${{ github.event.release.tag_name }} != v$version"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
