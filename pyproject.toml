[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physverify"
version = "0.9.1"
description = "Code verification for numerical simulation: test whether simulation code behaves as the mathematics predicts (convergence order, exact and manufactured solutions, conservation laws, time-integration coefficients)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ram Chandra Giri" }]
keywords = ["code verification", "verification", "method of manufactured solutions", "order of accuracy", "runge-kutta", "numerical methods", "physics", "simulation", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Testing",
    "Development Status :: 3 - Alpha",
]
dependencies = ["numpy>=1.24", "tomli>=1.1; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/rcgiri-physics/physverify"
Documentation = "https://rcgiri-physics.github.io/physverify/"
Issues = "https://github.com/rcgiri-physics/physverify/issues"
Changelog = "https://github.com/rcgiri-physics/physverify/blob/main/CHANGELOG.md"

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
dev = ["pytest>=8", "coverage>=7.10", "hypothesis>=6", "sympy>=1.12", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=1.0.8,<2"]

[project.scripts]
physverify = "physverify.cli:main"

[project.entry-points.pytest11]
physverify = "physverify.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physverify = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "benchmark"]

[tool.ruff]
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["F", "B", "UP", "I"]
# zip() truncating to the shorter input is relied on in places; strict= is a separate review
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["physverify", "pvbench"]

[tool.ruff.lint.per-file-ignores]
# results/ cites line numbers in the seeded-bug problems, so their imports stay where they are
"benchmark/pvbench/problems/*" = ["F401", "I001"]
# the import itself is what this script checks
"sandbox/probe.py" = ["F401", "I001"]
# short teaching examples; the closure is called inside its loop
"docs/examples/*" = ["B023"]

[tool.mypy]
# The public API (what `import physverify` and physverify.butcher export) is
# type checked in CI. The other modules still have errors; add each here once
# it is clean.
files = [
    "src/physverify/__init__.py",
    "src/physverify/checks.py",
    "src/physverify/mms.py",
    "src/physverify/order.py",
    "src/physverify/studies.py",
    "src/physverify/butcher.py",
]
follow_imports = "silent"
ignore_missing_imports = true

[tool.coverage.run]
# Measure with `coverage run -m pytest`, not pytest-cov: the pytest plugin
# imports physverify before pytest-cov starts, so module-level code read as
# unrun. The subprocess patch follows the probes into their child processes.
source = ["src/physverify"]
patch = ["subprocess"]
# Run by scripts/reproduce_all.py to regenerate results/, not by the tests.
omit = ["src/physverify/stochastic/calibrate.py", "src/physverify/stochastic/ising.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true
# Measured at 90% (2026-11-23); the floor leaves room for small changes.
fail_under = 85
