[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physverify"
version = "0.3.1"
description = "Verification checks for physics simulation code: manufactured solutions, order-of-accuracy studies and a seeded-bug benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ram Chandra Giri" }]
keywords = ["verification", "method of manufactured solutions", "numerical methods", "physics", "simulation", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Testing",
    "Development Status :: 3 - Alpha",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/rcgiri-physics/physverify"
Documentation = "https://github.com/rcgiri-physics/physverify/blob/main/docs/technical.md"
Issues = "https://github.com/rcgiri-physics/physverify/issues"
Changelog = "https://github.com/rcgiri-physics/physverify/blob/main/CHANGELOG.md"

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
dev = ["pytest>=8", "hypothesis>=6", "sympy>=1.12"]

[project.scripts]
physverify = "physverify.cli:main"

[project.entry-points.pytest11]
physverify = "physverify.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
