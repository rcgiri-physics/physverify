site_name: physverify
site_description: Code verification for numerical simulation. Test whether simulation code behaves as the mathematics predicts. Check convergence order, agreement with exact or manufactured solutions, conservation laws, and time-integration coefficients.
site_author: Ram Chandra Giri
site_url: https://rcgiri-physics.github.io/physverify/
copyright: Copyright &copy; 2026 Ram Chandra Giri, MIT licence

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: null
            filters: ["!^_"]

exclude_docs: |
  plan_ising.md
  plan_agent_eval.md
  hooks.py
  examples/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Start here: start-here.md
  - Getting started: getting-started.md
  - A spec in pyproject.toml: declarative.md
  - Can the spec fail? physverify mutate: mutate.md
  - How it works: how-it-works.md
  - What a PASS means: assumptions.md
  - Checks with examples:
      - Manufactured solutions: checks/manufactured-solutions.md
      - Order of convergence: checks/order.md
      - Reference solutions: checks/reference.md
      - Conserved quantities and budgets: checks/conservation.md
      - Exact patch tests: checks/patch.md
      - Runge-Kutta tables: checks/runge-kutta.md
      - Exact references: checks/exact-references.md
      - Identities and round trips: checks/identities.md
      - Hidden defaults, scale, stencils and fluxes: checks/defaults-scale-stencils.md
      - Operator invariants: checks/operator-invariants.md
      - Numerical controls, paths and Ito integrals: checks/numerical-controls.md
      - Statistics and Monte Carlo: checks/statistics.md
  - Convergence-study pitfalls: pitfalls.md
  - Recipes: recipes.md
  - Troubleshooting: troubleshooting.md
  - Running physverify:
      - Command line: running/cli.md
      - Scan rules: scan-rules.md
      - Continuous integration: ci.md
      - AI coding assistants: agent.md
      - Checking an AI code review: ai-review.md
      - Confirming one suspected defect: confirm.md
  - Reference:
      - API overview: api.md
      - API reference: reference/index.md
      - Patch test theory: patch.md
      - Ising checks: ising.md
      - Technical details: technical.md
  - Results on real code: results.md
  - Confirmed by maintainers: confirmed.md
  - Runge–Kutta table census: census.md
  - Related work and credits: related-work.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rcgiri-physics/physverify
      name: Source code on GitHub
