<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Outcome of 119 AI review claims checked by a run on 50 repositories tested clean: 40 changed a result, 51 were real but minor, 10 were wrong, 18 could not be settled">
<rect width="720" height="150" fill="#ffffff"/>
<text x="16" y="24" fill="#1d1d1f" font-weight="600">119 AI review claims on 50 repositories tested clean, each checked by a run</text>
<!-- bar: 680 px for 119 claims; 40, 51, 10, 18 -->
<g stroke="#ffffff" stroke-width="2">
<rect x="20" y="40" width="228.6" height="44" fill="#b42318"/>
<rect x="248.6" y="40" width="291.4" height="44" fill="#d4a72c"/>
<rect x="540" y="40" width="57.1" height="44" fill="#1a7f37"/>
<rect x="597.1" y="40" width="102.9" height="44" fill="#9a9aa2"/>
</g>
<g fill="#ffffff" font-weight="700" text-anchor="middle">
<text x="134" y="67">40</text>
<text x="394" y="67" fill="#1d1d1f">51</text>
<text x="568" y="67">10</text>
<text x="648" y="67">18</text>
</g>
<g fill="#1d1d1f" font-size="12">
<text x="20" y="104">changed a result</text>
<text x="20" y="119" fill="#4a4a50">33 distinct defects in 19 repositories</text>
<text x="250" y="104">real but minor</text>
<text x="250" y="119" fill="#4a4a50">bad input, display, unused paths</text>
<text x="520" y="104">wrong</text>
<text x="520" y="119" fill="#4a4a50">code is right</text>
<text x="612" y="104">not settled</text>
</g>
<text x="16" y="142" fill="#6b6b70" font-size="11.5">Counts within this sample only, not a bug rate. Labels from two automated checkers following written rules.</text>
</svg>
