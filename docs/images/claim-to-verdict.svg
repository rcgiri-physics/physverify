<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Confirming a claim: a claim from a review and a reference written from the physics go into the smallest run that tells the two answers apart; the run gives a verdict: confirmed, minor, rejected or open, with the numbers">
<rect width="720" height="230" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b70"/></marker></defs>
<rect x="16" y="28" width="206" height="66" rx="8" fill="#eef2fd" stroke="#2f5bd3" stroke-width="1.5"/>
<rect x="16" y="136" width="206" height="66" rx="8" fill="#eaf6ee" stroke="#1a7f37" stroke-width="1.5"/>
<rect x="270" y="78" width="190" height="74" rx="8" fill="#f6f6f8" stroke="#8a8a93" stroke-width="1.5"/>
<rect x="516" y="40" width="188" height="150" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.5"/>
<g fill="#1d1d1f" text-anchor="middle">
<text x="119" y="54" font-weight="600">A claim</text>
<text x="119" y="73" fill="#4a4a50" font-size="12">from an AI review, a colleague,</text>
<text x="119" y="88" fill="#4a4a50" font-size="12">a static check or your own doubt</text>
<text x="119" y="162" font-weight="600">A reference</text>
<text x="119" y="181" fill="#4a4a50" font-size="12">from the physics, not the code:</text>
<text x="119" y="196" fill="#4a4a50" font-size="12">exact case, conservation, order</text>
<text x="365" y="106" font-weight="600">Run the smallest test</text>
<text x="365" y="124" font-weight="600">that tells them apart</text>
<text x="365" y="142" fill="#4a4a50" font-size="12">in the sandbox</text>
<text x="610" y="64" font-weight="600">Verdict, with numbers</text>
<text x="610" y="90" fill="#b42318" font-weight="700">confirmed</text>
<text x="610" y="112" fill="#9a6700" font-weight="700">real but minor</text>
<text x="610" y="134" fill="#1a7f37" font-weight="700">rejected</text>
<text x="610" y="156" fill="#4a4a50" font-weight="700">open</text>
<text x="610" y="178" fill="#4a4a50" font-size="12">and why</text>
</g>
<g stroke="#6b6b70" stroke-width="1.6" fill="none" marker-end="url(#a)">
<path d="M222,61 C248,61 248,104 268,108"/>
<path d="M222,169 C248,169 248,126 268,122"/>
<path d="M460,115 L514,115"/>
</g>
<text x="16" y="18" fill="#6b6b70" font-size="12">Reading the code again rarely settles a claim; a run against an independent reference does.</text>
<text x="16" y="222" fill="#6b6b70" font-size="12">"Rejected" means the claim was wrong and the code is right.</text>
</svg>
